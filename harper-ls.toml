# Harper-Konfiguration — REFERENZ ONLY
# WICHTIG (getestet 2026-11-17): weder harper-ls (VS Code) noch harper-cli lesen diese Datei
# aus dem Projekt (GitHub Issue #2339: harper-ls kennt keine per-workspace toml).
# Wirksam in VS Code ist stattdessen .vscode/settings.json -> "harper.dialect",
# "harper.diagnosticSeverity", "harper.linters.<RegelName>".
# Diese Datei dient nur als Doku/Referenz; User-Config von harper-ls liegt in ~/.config/harper-ls.toml.

# American English (ERAU-Vorgabe)
dialect = "American"

# Sichtbarkeit der Markierungen: "hint" (default) / "warning" / "error"
diagnosticSeverity = "warning"

# Regeln anpassen — nur Abweichungen vom Default noetig, Rest bleibt default:
[linters]
LongSentences = false       # lange akademische Schachtelsaetze nicht melden
AvoidContractions = true    # akademischer Stil: don't -> do not, isn't -> is not ...

# isolateEnglish = true  # NICHT zuverlaessig (harper-cli 3.2.0 meldet deutsche Passagen
                        # trotzdem als SpellCheck) — fuer deutsche Texte cSpell/Duden
                        # nutzen; englische Fachbegriffe ins .harper-dictionary.txt
